name: implementation-tests
on:
  push:
    paths: ['implementation/**', '.github/workflows/implementation-tests.yml']
  pull_request:
    paths: ['implementation/**']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run evaluator tests without third-party dependencies
        working-directory: implementation
        run: python -m pytest -q

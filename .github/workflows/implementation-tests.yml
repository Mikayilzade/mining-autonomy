name: implementation-runtime-chain
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: implementation-runtime-chain-manual
  cancel-in-progress: false

jobs:
  runtime-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run exact local I106-I112 chain
        run: python3 implementation/i113_local_runtime_chain_runner.py
      - name: Upload runtime receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: i113-runtime-chain-receipts
          path: |
            implementation/I106_LOCAL_RUNTIME_RECEIPT.json
            implementation/I107_RUNTIME_RECEIPT_BINDING_RESULT.json
            implementation/I108_RUNTIME_RECEIPT_LINEAGE_RESULT.json
            implementation/I109_LINEAGE_PREAUTHORIZATION_CONSISTENCY_RESULT.json
            implementation/I110_I109_RESULT_CHAIN_CONTRACT_RESULT.json
            implementation/I111_PREOBSERVATION_ARTIFACT_MANIFEST.json
            implementation/I112_I111_MANIFEST_OFFLINE_VERIFIER_RESULT.json
            implementation/I113_LOCAL_RUNTIME_CHAIN_RESULT.json
          if-no-files-found: warn
          retention-days: 1
